; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = lilygo-t-display-s3
core_dir = /tmp/.platformio

[tft_flags]
build_flags =
    -D USER_SETUP_LOADED=1
    -D LILYGO_T_DISPLAY_S3
    -D CGRAM_OFFSET=1
    -D TFT_PARALLEL_8_BIT=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=170
    -D TFT_HEIGHT=320
    -D TFT_BL=38
    -D TFT_MISO=-1
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=6
    -D TFT_DC=7
    -D TFT_RST=5
    -D TFT_WR=8
    -D TFT_RD=9
    -D TFT_D0=39
    -D TFT_D1=40
    -D TFT_D2=41
    -D TFT_D3=42
    -D TFT_D4=45
    -D TFT_D5=46
    -D TFT_D6=47
    -D TFT_D7=48






[common]
build_flags = 
	-g3  -Wall -Wextra  -Wstack-protector  -ftrapv
	-std=gnu++14
	-mfix-esp32-psram-cache-issue
	-D VERSION=2.3
	-I"include/pid"
	-I"include/modbus"
	-I"include/devices"
	-I"include/www"
	-I"include/utils"
	-I"include/weather"
	-I"include/mainLoop" 
	-I "include/ai"
	-I "include/provider"
	-DUSE_ESP_IDF_LOG
	-DLOGFILE_SYS='"/logSYS.txt"'
	-DTAG='"EJunkies"'
	-DCORS_DEBUG=1
	;-DMQTT1='"10.0.0.11"'
	-DMODBUS_VERBOSE=1
	-DWEATHER_API='"https://api.open-meteo.com"'  ; auskommentieren = Wetter-PV-Bonus aus
	-DTINYNN_ENABLE   ; TinyNN Regression-Modell an/aus
	; -DINFLUX1='"http://rantanplan-ethernet:8086"'	
	-DCORE_DEBUG_LEVEL=4  ; 5 = Verbose, 4 = Debug
	;-DAMIS_READER_DEV=1
	;-DFRONIUS_SOLAR_API=1
	;-DFRONIUS_IV=1
	-DHUAWEI_MODBUS=1    ; Huawei SUN2000 via Modbus/TCP
	-DMODBUSIP_TIMEOUT=5000
	;; -DCARD_READER1=1
	-DLOG_DELTA_FORCE_WRITE=10000
	-DLOG_KEEP_ALIVE_TIME_IN_MS=60000
	-DLOG_DAY_TIME_IN_HOURS=6
	-DLOG_NIGHT_TIME_IN_HOURS=22
	-DSHELLY=1
	-DRUN_IT=1
	-DLOG_LEVEL_ESP=5
	-DLOG_LEVEL_ARD=4 
	-D configUSE_TRACE_FACILITY=1
    -D configUSE_STATS_FORMATTING_FUNCTIONS=1
    -DconfigMINIMAL_STACK_SIZE=2048
	-DCONFIG_FREERTOS_USE_TRACE_FACILITY=1
	-DCONFIG_FREERTOS_USE_STATS_FORMATTING_FUNCTIONS=1
	-DCONFIG_FREERTOS_CHECK_STACKOVERFLOW=2
	-DIMMEDIATE_LOG_COUNT=3
	-DSMART_LOG_INTERVAL=5000
	-DTEMP_FILTER_SIZE=5
	-DTASK_TEMPERATURE_INTERVAL=20000
	-DTASK_WEBSOCKET_INTERVAL=10000
	-DTASK_MODBUS_AMISREADER_INTERVAL=40000
	-DTASK_NETWORK_MONITOR_INTERVAL=5000
	-DTASK_CLOCK_INTERVAL=10000
	-DTASK_PID_INTERVAL=2000
	-DTASK_MAINTANANCE_INTERVAL=60000
	; ── Adaptive Energy (PV) Query ──
	-DENERGY_DAY_INTERVAL=40000
	-DENERGY_NIGHT_INTERVAL=300000
	-DENERGY_NIGHT_OFF_START=23
	-DENERGY_NIGHT_OFF_END=5
	-DENERGY_LOW_PV_WATTS=20
	-DENERGY_WAKE_PV_WATTS=50
	-DENERGY_LOW_PV_HOLD_MS=300000
	-DHYSTERESIS_WATT=12
	-DLOW_BOUND_PWM=6
	-DBOILER=1
	;-DLOXONE_API=1    ; Loxone als zusätzliche EnergySource
	;-DLOXONE='"10.0.0.210"'
	-DTASK_BLINK_INTERVALL=500

	
lib_deps_builtin = 
lib_deps_external = 
	emelianov/modbus-esp8266@^4.1.0
	bodmer/TFT_eSPI@^2.5.30
	ESP32Async/ESPAsyncWebServer@^3.12.1
	ESP32Async/AsyncTCP@^3.5.0
	bblanchon/ArduinoJson@^7.0.0  
	fabianoriccardi/ESPLogger@^2.0.0
	paulstoffregen/OneWire@^2.3.7
	milesburton/DallasTemperature@^3.11.0
	arduino-libraries/Arduino_JSON@^0.2.0
	knolleary/PubSubClient@^2.8
	tobiasschuerg/ESP8266 Influxdb@^3.13.1

[env:lilygo-t-display-s3]
platform = espressif32
framework = arduino

board_build.filesystem = littlefs
board = lilygo-t-display-s3
lib_deps = ${common.lib_deps_external}
build_type = debug
monitor_filters = 
	esp32_exception_decoder
	time
	log2file
board_build.f_cpu = 240000000L
upload_speed = 115200
upload_protocol = esptool
monitor_speed = 115200
board_build.f_flash = 80000000L
board_build.flash_mode = dio
build_flags = 
	${common.build_flags}
	${tft_flags.build_flags}
	-DESP_LILY_GO

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
platform_packages = framework-espidf @ https://github.com/espressif/esp-idf.git
framework = arduino
board_build.filesystem = littlefs
build_type = debug
monitor_filters = 
	esp32_exception_decoder
	time
	log2file
build_flags = 
	${common.build_flags}
	-DARDUINO_ESP32S3_DEV -DBOARD_HAS_PSRAM -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DCORE_DEBUG_LEVEL=1  -DESP_S3
lib_deps = ${common.lib_deps_external}
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.memory_type = qio_opi
board_build.psram_type = opi
upload_speed = 115200
monitor_speed = 115200
board_build.f_flash = 80000000L
board_build.flash_mode = dio
monitor_port = /dev/ttyACM0
upload_port = /dev/ttyACM0

[env:espwroom32]
platform = espressif32
framework = arduino
board = upesy_wroom
monitor_speed = 115200
build_type = debug
monitor_filters = 
	esp32_exception_decoder
	time
	log2file
build_flags = 
	${common.build_flags}
	-DESP_S3
